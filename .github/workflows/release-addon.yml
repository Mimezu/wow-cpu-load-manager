name: Publish addon release

on:
  push:
    branches:
      - main
    paths:
      - "CPULoadManager.toc"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a daily big-push version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^## Version: //p' "CPULoadManager.toc" | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is a normal patch build; no public release."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build install-ready ZIP
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          STAGE="$(mktemp -d)"
          ADDON_ROOT="$STAGE/CPULoadManager"
          RUNTIME_FILES=(
            "CPULoadManager.toc"
            "Core.lua"
            "Benchmark.lua"
            "Options.lua"
            "Assets/CPULoadManagerIcon.tga"
          )

          declare -A PACKAGED_FILES=()
          for file in "${RUNTIME_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required runtime file is missing: $file" >&2
              exit 1
            fi
            PACKAGED_FILES["$file"]=1
            install -Dm0644 "$file" "$ADDON_ROOT/$file"
          done

          mapfile -t TOC_FILES < <(
            sed -e 's/\r$//' -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "CPULoadManager.toc"
          )
          for file in "${TOC_FILES[@]}"; do
            if [[ -z "${PACKAGED_FILES[$file]+included}" ]]; then
              echo "TOC runtime file is not in the package allow-list: $file" >&2
              exit 1
            fi
          done

          (
            cd "$STAGE"
            zip -Xqr "$GITHUB_WORKSPACE/CPULoadManager.zip" "CPULoadManager"
          )

          unzip -tq "$GITHUB_WORKSPACE/CPULoadManager.zip"
          ACTUAL_ENTRIES="$(
            unzip -Z1 "$GITHUB_WORKSPACE/CPULoadManager.zip" |
              sed '/\/$/d' |
              LC_ALL=C sort
          )"
          EXPECTED_ENTRIES="$(
            printf 'CPULoadManager/%s\n' "${RUNTIME_FILES[@]}" |
              LC_ALL=C sort
          )"
          if [[ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]]; then
            echo "ZIP contents do not match the runtime allow-list." >&2
            diff -u <(printf '%s\n' "$EXPECTED_ENTRIES") <(printf '%s\n' "$ACTUAL_ENTRIES") || true
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it unchanged."
            exit 0
          fi

          gh release create "$TAG" "CPULoadManager.zip" \
            --target "$GITHUB_SHA" \
            --title "CPULoadManager $VERSION" \
            --generate-notes
